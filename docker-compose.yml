services:
  neo4j:
    image: neo4j:5.24-community
    container_name: wexa-graph-neo4j
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    environment:
      - NEO4J_AUTH=neo4j/localdevpassword
      - NEO4J_PLUGINS=[]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
